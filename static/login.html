<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cquAI — Beta privata</title>
<style>
:root{
  --bg:#fbf5ec; --ink:#101b2b; --coral:#f28b78; --line:#f2c5b8;
  --muted:#8b857d; --card:#fffaf2;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:radial-gradient(circle at 40% 12%, #fffdf8 0, var(--bg) 62%);
  color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
.screen{
  width:min(480px,100vw); min-height:100vh; position:relative; overflow:hidden;
  padding:70px 34px 38px; background:linear-gradient(180deg,#fffaf4,#fbf1e7);
}
.logo{
  text-align:center; font-weight:900; letter-spacing:-.075em; font-size:76px; line-height:1;
  margin:55px 0 110px; color:var(--ink);
}
.logo span{color:var(--coral)}
.smile{position:absolute; right:52px; top:72px; color:var(--coral); font-size:42px; transform:rotate(6deg)}
h1{text-align:center; font-size:36px; margin:0 0 18px; letter-spacing:.03em}
p{text-align:center; margin:0 0 46px; font-size:19px; color:#2d3743}
.field{
  display:flex; align-items:center; gap:16px; border:1.5px solid var(--line);
  border-radius:24px; padding:18px 22px; background:rgba(255,255,255,.42);
  box-shadow:0 10px 30px rgba(80,50,25,.06); margin-bottom:34px;
}
.field svg{flex:0 0 auto; color:var(--coral); opacity:.8}
input{
  width:100%; border:0; outline:0; background:transparent; font-size:22px;
  color:var(--ink);
}
input::placeholder{color:#aaa5a0}
button{
  width:100%; border:0; border-radius:24px; padding:22px 24px; cursor:pointer;
  font-size:25px; font-weight:750; color:white; background:linear-gradient(180deg,#f49a88,#f18472);
  box-shadow:0 16px 35px rgba(242,139,120,.28);
}
.small{
  position:absolute; left:0; right:0; bottom:82px; text-align:center; color:#928d86;
  display:flex; justify-content:center; gap:10px; align-items:center; font-size:16px;
}
.wave{position:absolute; left:-40px; right:-40px; bottom:-30px; height:130px; pointer-events:none}
.w1,.w2,.w3,.w4{position:absolute; bottom:0; height:120px; border-radius:50% 50% 0 0}
.w1{left:-80px;width:260px;background:#f7a08d;bottom:20px;transform:rotate(25deg)}
.w2{left:0;width:420px;background:#b9dfcd;bottom:-42px}
.w3{right:60px;width:290px;background:#ffc75f;bottom:-35px}
.w4{right:-50px;width:250px;background:#8fd4ec;bottom:-25px}
.err{margin:18px 0 0;color:#9d2219;text-align:center;font-weight:650}
@media(max-width:420px){.logo{font-size:64px}.screen{padding-left:26px;padding-right:26px}}
</style>
</head>
<body>
<main class="screen">
  <div class="smile">⌣</div>
  <div class="logo">cqu<span>AI</span></div>
  <h1>Beta privata</h1>
  <p>Inserisci la password per entrare.</p>
  <form method="post" action="/login">
    <label class="field">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
    </label>
    <button type="submit">Entra ›</button>
  </form>
  {%ERROR%}
  <div class="small">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
    Accesso riservato
  </div>
  <div class="wave"><div class="w1"></div><div class="w2"></div><div class="w3"></div><div class="w4"></div></div>
</main>
</body>
</html>
